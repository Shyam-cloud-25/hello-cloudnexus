name: Deploy CloudNexus Frontend & Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------- FRONTEND ----------------

      - name: Build Frontend Image
        run: |
          docker build -t hello-cloudnexus-frontend ./frontend

      - name: Tag Frontend Image
        run: |
          docker tag hello-cloudnexus-frontend:latest \
          ${{ secrets.AWS_ECR_URL }}:frontend

      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.AWS_ECR_URL }}:frontend

      # ---------------- BACKEND ----------------

      - name: Build Backend Image
        run: |
          docker build -t hello-cloudnexus-backend ./backend

      - name: Tag Backend Image
        run: |
          docker tag hello-cloudnexus-backend:latest \
          ${{ secrets.AWS_ECR_URL }}:backend

      - name: Push Backend Image
        run: |
          docker push ${{ secrets.AWS_ECR_URL }}:backend

      # ---------------- DEPLOY ----------------

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker stop frontend || true
            docker rm frontend || true
            docker stop backend || true
            docker rm backend || true

            docker pull ${{ secrets.AWS_ECR_URL }}:frontend
            docker pull ${{ secrets.AWS_ECR_URL }}:backend

            docker run -d -p 5000:5000 --name frontend \
            ${{ secrets.AWS_ECR_URL }}:frontend

            docker run -d -p 5001:5001 --name backend \
            ${{ secrets.AWS_ECR_URL }}:backend

